name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_HOME: ${{ github.workspace }}/.ci-cache/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.ci-cache/rustup
  CARGO_TERM_COLOR: always
  CC: clang
  CXX: clang++

jobs:
  build:
    name: Debian 10 / Clang
    runs-on: ubuntu-latest
    container:
      image: debian:10-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Install system build tools
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'deb http://archive.debian.org/debian buster main' \
            'deb http://archive.debian.org/debian-security buster/updates main' \
            > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' \
            > /etc/apt/apt.conf.d/99archive
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates clang curl file git \
            libstdc++-8-dev ninja-build pkg-config xz-utils zstd
          rm -rf /var/lib/apt/lists/*

          cmake_archive=cmake-3.31.6-linux-x86_64.tar.gz
          curl --fail --location --retry 3 \
            --output "/tmp/$cmake_archive" \
            "https://github.com/Kitware/CMake/releases/download/v3.31.6/$cmake_archive"
          echo '5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf  /tmp/cmake-3.31.6-linux-x86_64.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/$cmake_archive" \
            --strip-components=1 --directory=/usr/local
          rm "/tmp/$cmake_archive"

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Restore Rust toolchain
        id: rustup-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rustup-debian10-x86_64-1.97.0

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$CARGO_HOME/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal \
                  --default-toolchain 1.97.0
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.97.0 --profile minimal \
            --component clippy --component rustfmt
          rustup default 1.97.0
          rustc --version --verbose
          clang --version | head -n 1

      - name: Save Rust toolchain
        if: steps.rustup-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rustup-debian10-x86_64-1.97.0

      - name: Restore OpenCV
        id: opencv-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: opencv_static/build/opencv-install
          key: >-
            opencv-debian10-x86_64-clang7-4.12.0-${{
            hashFiles('opencv_static/CMakeLists.txt', 'opencv_static/build.sh') }}

      - name: Build static OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          CC=clang CXX=clang++ ./opencv_static/build.sh

      - name: Save OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: opencv_static/build/opencv-install
          key: ${{ steps.opencv-cache.outputs.cache-primary-key }}

      - name: Restore Cargo and target
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: >-
            rust-debian10-x86_64-clang7-${{
            hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml',
            'opencv_static/CMakeLists.txt', 'opencv_static/build.sh') }}-${{ github.sha }}
          restore-keys: |
            rust-debian10-x86_64-clang7-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'opencv_static/CMakeLists.txt', 'opencv_static/build.sh') }}-
            rust-debian10-x86_64-clang7-

      - name: Check, test, and build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked

      - name: Verify static libraries and glibc ceiling
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/marsbot
          file "$binary"
          ldd "$binary" | tee /tmp/ldd.txt
          if grep -E 'not found|lib(opencv|jpeg|sqlite3|stdc\+\+|c\+\+)\.so' /tmp/ldd.txt; then
            echo 'Unexpected or missing dynamic library' >&2
            exit 1
          fi

          max_glibc="$({
            readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
              | sed 's/GLIBC_//' \
              || true
          } | sort -V | tail -n 1)"
          test -n "$max_glibc"
          if [[ "$(printf '%s\n' 2.28 "$max_glibc" | sort -V | tail -n 1)" != '2.28' ]]; then
            echo "glibc requirement $max_glibc exceeds 2.28" >&2
            exit 1
          fi
          echo "Maximum glibc requirement: $max_glibc"

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

          package="marsbot-$version-linux-x86_64-glibc2.28"
          mkdir -p "dist/$package"
          install -m 0755 target/release/marsbot "dist/$package/marsbot"
          install -m 0644 README.md "dist/$package/README.md"
          tar --create --gzip --directory=dist \
            --file="dist/$package.tar.gz" "$package"
          rm -rf "dist/$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Save Cargo and target
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: marsbot-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Runtime / ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 11
            image: debian:11-slim
            family: debian
          - name: Rocky 8
            image: rockylinux:8
            family: rocky
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install runtime inspection tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.family }}' == debian ]]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              binutils file tar
            rm -rf /var/lib/apt/lists/*
          else
            dnf install -y binutils file gzip tar
            dnf clean all
          fi

      - name: Download package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: marsbot-linux-x86_64
          path: dist

      - name: Verify package compatibility
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check *.sha256)
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          tar --extract --gzip --file="$archive" --directory=dist
          binary="$(find dist -mindepth 2 -maxdepth 2 -type f -name marsbot -print -quit)"
          test -x "$binary"
          file "$binary"
          ldd "$binary" | tee /tmp/ldd.txt
          ! grep -E 'not found|lib(opencv|jpeg|sqlite3|stdc\+\+|c\+\+)\.so' /tmp/ldd.txt

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: marsbot-linux-x86_64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "marsbot $VERSION"
