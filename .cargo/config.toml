[env]
OPENCV_LINK_LIBS = { value = "static=opencv_imgcodecs,static=opencv_imgproc,static=opencv_core,static=libjpeg-turbo", force = true }
CXXSTDLIB = ""
OPENCV_INCLUDE_PATHS = { value = "opencv_static/build/opencv-install/include/opencv4", relative = true, force = true }
OPENCV_LINK_PATHS = { value = "opencv_static/build/opencv-install/lib", force = true, relative = true }
SQLITE3_STATIC = "1"

[target.x86_64-unknown-linux-gnu]
# 使用 C++ Clang 驱动，让它可移植地发现并静态链接当前系统的 libstdc++。
linker = "clang++"
rustflags = [
    "-C", "link-arg=-Wl,-Bstatic",
    "-C", "link-arg=-lstdc++",
    "-C", "link-arg=-Wl,-Bdynamic",
]
